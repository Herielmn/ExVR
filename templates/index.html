<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>ExVR-Next Controller</title>
    <style>
        :root {
            --surface-base: #1C1C1E;
            --surface-card: #2C2C2E;
            --text-primary: #F5F5F7;
            --text-secondary: #AEAEB2;
            --separator: #38383A;
            --accent-fill: #0B6FD8;
            --on-accent: #FFFFFF;
            --radius-lg: 14px;
            --font-ui: Inter, "Inter var", -apple-system, "Segoe UI Variable Text",
                       "Segoe UI", system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 24px;
            background: var(--surface-base);
            color: var(--text-primary);
            font: 17px/1.45 var(--font-ui);
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 590;
            letter-spacing: 0.01em;
        }
        p {
            margin: 0;
            max-width: 30ch;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
        button {
            appearance: none;
            width: 100%;
            min-height: 56px;
            border: 0;
            border-radius: var(--radius-lg);
            background: var(--surface-card);
            box-shadow: inset 0 0 0 0.5px var(--separator);
            color: var(--text-primary);
            font: 590 17px/1 var(--font-ui);
            cursor: pointer;
            transition: transform 150ms cubic-bezier(0.32, 0.72, 0, 1),
                        background 150ms ease-out;
        }
        button:active { transform: scale(0.97); background: var(--accent-fill); color: var(--on-accent); }
        button:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            button { transition: none; }
        }
    </style>
</head>
<body>
    <h1>ExVR-Next</h1>
    <p>Hold the phone in the hand you are controlling.</p>
    <div class="choices">
        <button type="button" onclick="location.href='/left'">Left controller</button>
        <button type="button" onclick="location.href='/right'">Right controller</button>
    </div>
</body>
</html>
