<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExVR-Next</title>

<script>
  var choice = "system";
  var skin = "";
  try {
    choice = localStorage.getItem("exvr.theme") || "system";
    skin = localStorage.getItem("exvr.skin") || "";
  } catch (error) {}
  if (choice === "qt") { skin = "qt"; choice = "system"; }
  var theme = skin === "qt" ? "qt" : choice;
  var dark = theme === "dark"
    || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.themeResolved = dark ? "dark" : "light";
</script>

<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/ui/qt.css">

<header id="titlebar">
  <h1 class="name">ExVR-Next</h1>
  <span class="badge" id="version" hidden></span>
  <div class="grip" id="grip"></div>
  <button class="chrome-button" id="skin" aria-label="Windchime Moonshadow"
          title="Windchime Moonshadow" aria-pressed="false">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="2.8" y="3.3" width="10.4" height="9.4" rx="1.4"></rect>
      <path d="M2.8 6.3h10.4M5.4 8.9h5.2M5.4 10.9h3"></path>
    </svg>
  </button>
  <button class="chrome-button" id="theme" aria-label="Theme" title="Theme">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <circle cx="8" cy="8" r="5.3"></circle>
      <path class="solid" d="M8 2.7a5.3 5.3 0 0 1 0 10.6z"></path>
    </svg>
  </button>
  <button class="chrome-button window-only" id="win-min" aria-label="Minimize" title="Minimize">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8h8.8"></path></svg>
  </button>
  <button class="chrome-button window-only" id="win-max" aria-label="Maximize" title="Maximize">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="3.7" y="3.7" width="8.6" height="8.6" rx="1.6"></rect>
    </svg>
  </button>
  <button class="chrome-button danger window-only" id="win-close" aria-label="Close" title="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4"></path>
    </svg>
  </button>
</header>

<section class="stage">
  <div class="viewport">
    <img id="video" alt="Camera preview">
    <canvas id="overlay" width="640" height="480" aria-hidden="true"></canvas>
    <div class="placeholder" id="viewport-placeholder">
      <span id="viewport-message">Connecting to the core...</span>
    </div>
  </div>

  <div class="statusbar">
    <span class="pill" id="pill-tracking"><span class="dot"></span><span class="text">Stopped</span></span>
    <span class="pill tabular" id="pill-fps" hidden><span class="text">0 fps</span></span>
    <span class="spacer"></span>
    <button class="button small" id="preview-toggle">Preview</button>
  </div>

  <div class="actions">
    <button class="button primary" id="tracking-toggle">Start tracking</button>
    <button class="button" id="recentre">Recentre</button>
  </div>

  <div id="stage-controls"></div>
</section>

<nav class="segments" id="segments" role="tablist" aria-label="Sections"></nav>

<main id="panes"></main>

<footer id="actionbar">
  <button class="button small" id="reload">Reload</button>
  <button class="button small" id="save">Save</button>
  <span class="spacer"></span>
  <button class="button small quiet" id="advanced">Advanced</button>
</footer>

<pre id="log" aria-live="polite"></pre>

<script type="module" src="/ui/app.js"></script>
