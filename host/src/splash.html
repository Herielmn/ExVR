<meta charset="utf-8">
<title>ExVR-Next</title>
<style>
  :root {
    color-scheme: light;
    --surface-base: #F2F2F7;
    --text-primary: #1D1D1F;
    --text-secondary: #6E6E73;
    --separator: #D2D2D7;
    --accent: #007AFF;
    --on-accent: #FFFFFF;
    --danger-text: #C10012;
    --danger-fill: #C10012;
    --material-chrome: rgba(255, 255, 255, 0.62);
    --material-blur: blur(28px) saturate(190%);
    --fill-hover: rgba(0, 0, 0, 0.04);
    --fill-active: rgba(0, 0, 0, 0.08);
    --wash:
      radial-gradient(1200px 760px at 6% -14%, rgba(255, 255, 255, 0.98),
                      rgba(255, 255, 255, 0) 58%),
      radial-gradient(900px 680px at 98% 2%, rgba(236, 244, 255, 0.95),
                      rgba(236, 244, 255, 0) 60%),
      radial-gradient(1000px 760px at 80% 112%, rgba(255, 247, 250, 0.90),
                      rgba(255, 247, 250, 0) 58%);
    --font-ui: "Segoe UI Variable Text", "Segoe UI", Inter, "Inter var",
               system-ui, -apple-system, sans-serif;
    --text-sm: 13px;
    --text-md: 15px;
    --space-2: 8px;
    --space-4: 16px;
    --radius-sm: 6px;
    --duration-fast: 150ms;
    --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-base: #1C1C1E;
      --text-primary: #F5F5F7;
      --text-secondary: #AEAEB2;
      --separator: #38383A;
      --accent: #0A84FF;
      --danger-text: #FF6961;
      --danger-fill: #E03024;
      --material-chrome: rgba(28, 28, 30, 0.62);
      --fill-hover: rgba(255, 255, 255, 0.06);
      --fill-active: rgba(255, 255, 255, 0.12);
      --wash:
        radial-gradient(1200px 760px at 6% -14%, rgba(10, 132, 255, 0.10),
                        rgba(10, 132, 255, 0) 60%),
        radial-gradient(900px 680px at 98% 2%, rgba(120, 90, 220, 0.10),
                        rgba(120, 90, 220, 0) 62%),
        radial-gradient(1000px 760px at 80% 112%, rgba(255, 255, 255, 0.04),
                        rgba(255, 255, 255, 0) 58%);
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--wash), var(--surface-base);
    color: var(--text-primary);
    font: var(--text-md) / 1.45 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    height: 38px;
    flex: 0 0 auto;
    padding-left: var(--space-4);
    background: var(--material-chrome);
    backdrop-filter: var(--material-blur);
    -webkit-backdrop-filter: var(--material-blur);
    border-bottom: 0.5px solid var(--separator);
  }
  header .name {
    margin: 0;
    font-size: var(--text-sm);
    font-weight: 590;
    letter-spacing: 0.01em;
  }
  header .grip { flex: 1; align-self: stretch; }
  .chrome-button {
    width: 44px;
    height: 38px;
    border: 0;
    background: none;
    color: var(--text-secondary);
    font-size: var(--text-sm);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out),
                color var(--duration-fast) var(--ease-out);
  }
  .chrome-button svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
  }
  .chrome-button:hover { background: var(--fill-hover); color: var(--text-primary); }
  .chrome-button:active { background: var(--fill-active); }
  .chrome-button.danger:hover { background: var(--danger-fill); color: var(--on-accent); }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }
  :focus:not(:focus-visible) { outline: none; }
  main {
    flex: 1;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 18px;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--separator);
    border-top-color: var(--accent);
    animation: spin 800ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--separator); }
    .chrome-button { transition: none; }
  }
  h2 { font-size: var(--text-md); font-weight: 590; margin: 0; }
  p { margin: 0; font-size: var(--text-sm); color: var(--text-secondary); max-width: 46ch; }
  .error h2 { color: var(--danger-text); }
  .error .spinner { display: none; }
</style>

<header>
  <h1 class="name">ExVR-Next</h1>
  <div class="grip" id="grip"></div>
  <button class="chrome-button" id="min" aria-label="Minimize" title="Minimize">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8h8.8"></path></svg>
  </button>
  <button class="chrome-button" id="max" aria-label="Maximize" title="Maximize">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="3.7" y="3.7" width="8.6" height="8.6" rx="1.6"></rect>
    </svg>
  </button>
  <button class="chrome-button danger" id="close" aria-label="Close" title="Close">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4"></path>
    </svg>
  </button>
</header>
<main id="main">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Starting the tracking core</h2>
  <p id="detail">Loading the models and opening the control API. The first launch
    after an update takes longer while ONNX Runtime warms up.</p>
</main>

<script>
  const send = (message) => window.ipc && window.ipc.postMessage(message);
  document.getElementById("grip").addEventListener("mousedown", () => send("drag"));
  document.querySelector("header .name").addEventListener("mousedown", () => send("drag"));
  document.getElementById("grip").addEventListener("dblclick", () => send("maximize"));
  document.getElementById("min").onclick = () => send("minimize");
  document.getElementById("max").onclick = () => send("maximize");
  document.getElementById("close").onclick = () => send("close");

  window.exvrFail = (html) => {
    document.getElementById("main").classList.add("error");
    document.getElementById("title").textContent = "ExVR could not start";
    document.getElementById("detail").innerHTML = html;
  };
</script>
